name: Frontend Security Scan Smartbrain

on:
  workflow_dispatch:

jobs:
  security-scan:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # SAST
      
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
       node-version: '20'
       
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
       python-version: '3.x'

    - name: Install ESLint and plugins
      working-directory: SmartBrain project
      run: npm install eslint eslint-plugin-security eslint-plugin-react --save-dev --legacy-peer-deps

    - name: Run ESLint on frontend
      id: eslint
      working-directory: SmartBrain project
      run: npx eslint . --format json -o ../frontend_eslint_report.json
      continue-on-error: true

    - name: Install OpenGrep
      run: |
        curl -Lo opengrep https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86
        chmod +x opengrep
        sudo mv opengrep /usr/local/bin/opengrep

    - name: Run OpenGrep on frontend
      id: opengrep
      run: opengrep scan --config auto "SmartBrain project" --json --output frontend_opengrep_report.json
      continue-on-error: true

    - name: Upload SAST reports
      uses: actions/upload-artifact@v7
      with:
        name: frontend-sast-reports
        path: |
          frontend_eslint_report.json
          frontend_opengrep_report.json

    # SCA

    - name: Install OSV-Scanner
      run: |
        curl -Lo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
        chmod +x osv-scanner
        sudo mv osv-scanner /usr/local/bin/osv-scanner

    - name: Run OSV-Scanner on frontend (table output)
      id: osv-table
      working-directory: SmartBrain project
      run: osv-scanner --lockfile package-lock.json --format table
      continue-on-error: true

    - name: Run OSV-Scanner on frontend (markdown report)
      working-directory: SmartBrain project
      run: osv-scanner --lockfile package-lock.json --format markdown > ../frontend_osv_findings.md
      continue-on-error: true

    - name: Run npm audit on frontend
      id: npm-audit
      working-directory: SmartBrain project
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Upload SCA report
      uses: actions/upload-artifact@v7
      with:
        name: frontend-sca-report
        path: frontend_osv_findings.md

    # Container Security

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build frontend image
      uses: docker/build-push-action@v7
      with:
        context: ./SmartBrain project
        push: false
        tags: smartbrain-frontend:scan
        build-args: |
          VITE_API_URL=http://placeholder:3000
        load: true
      
    - name: Run Hadolint on frontend Dockerfile
      id: hadolint
      run: docker run --rm -i hadolint/hadolint hadolint --format json - < "SmartBrain project/Dockerfile" > frontend_hadolint_report.json
      continue-on-error: true

    - name: Run Dockle on frontend image
      id: dockle
      uses: goodwithtech/dockle-action@main
      with:
        image: smartbrain-frontend:scan
        format: json
        output: frontend_dockle_report.json
        exit-code: '1'
        exit-level: warn
      continue-on-error: true

    - name: Run Trivy on frontend image
      id: trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: smartbrain-frontend:scan
        format: json
        output: frontend_trivy_report.json
        severity: HIGH,CRITICAL
      continue-on-error: true

    - name: Upload container security reports
      uses: actions/upload-artifact@v7
      with:
        name: frontend-container-reports
        path: |
          frontend_hadolint_report.json
          frontend_dockle_report.json
          frontend_trivy_report.json
        
    - name: Fail pipeline if any security issues were found
      if: steps.eslint.outcome == 'failure' || steps.opengrep.outcome == 'failure' || steps.osv-table.outcome == 'failure' || steps.npm-audit.outcome == 'failure' || steps.hadolint.outcome == 'failure' || steps.dockle.outcome == 'failure' || steps.trivy.outcome == 'failure'
      run: |
        echo "Security issues were detected in one or more scans. See uploaded artifacts for details."
        exit 1
